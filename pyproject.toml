[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-scene-cutter-renamer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "datasets",
  "ipywidgets",
  "numpy<2",
  "pyyaml",
  "pytest",
  "soundfile",
  "torch==2.2.2",
  "torchaudio==2.2.2",
  "transformers<5",
  "ipykernel",
  "InquirerPy",
  "openai>=1.0",
  "pydantic>=2.0",
  "ruamel.yaml",
]


[dependency-groups]
dev = [
    "ruff>=0.15.15",
]

[tool.hatch.build.targets.wheel]
packages = ["cinema_clapboard_app"]

[project.scripts]
cinema-clapboard = "cinema_clapboard_app.batch_runner:main"