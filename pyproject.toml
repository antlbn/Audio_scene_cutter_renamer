[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audio-scene-cutter-renamer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy<2",
  "pyyaml",
  "soundfile",
  "torch>=2.2.2",
  "torchaudio>=2.2.2",
  "transformers<5",
  "InquirerPy",
  "openai>=1.0",
  "pydantic>=2.0",
  "ruamel.yaml",
  "static-ffmpeg",
]


[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "pytest",
]
notebook = [
    "ipywidgets",
    "ipykernel",
    "datasets",
]

[tool.hatch.build.targets.wheel]
packages = ["cinema_clapboard_app"]

[project.scripts]
cinema-clapboard = "cinema_clapboard_app.cli:main"

# ── PyTorch index routing ────────────────────────────────────────────────────
# macOS (Apple Silicon / Intel): CPU-only.
# Windows / Linux: CUDA 12.4 (cu124).
# Для смены версии CUDA замени pytorch-cu124 на pytorch-cu121 / pytorch-cu118.
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true