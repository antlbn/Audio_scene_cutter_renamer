clapper:
  audio_model:
    # Hugging Face CLAP checkpoint used for audio/text similarity.
    model_name: laion/clap-htsat-fused
    # Keep the downloaded model inside the project tree by default.
    cache_dir: .cache/clap
    # Audio windows are resampled to this rate before inference.
    target_sample_rate: 48000
    # Window size in seconds for sliding CLAP inference.
    window_seconds: 1.0
    # Hop size in seconds between windows.
    hop_seconds: 0.5
    # Minimum similarity score required to keep a window as a hit.
    threshold: 0.25
    # "auto" uses CUDA if available, otherwise CPU.
    device: auto

  text_search:
    # Keep the top N text matches for each detected point.
    top_n: 3
    # Progress output can be disabled later when more modules are added.
    show_progress: true
    # Default text keys used to compare against the audio windows.
    text_keys:
      - clapper board snap
      #- sharp clap sound
      #- loud click
      - film slate clap
      #- clap noise
      #- clapperboard closing
      - slate snap
      #- production clap
      - sharp film clap
      #- clapper strike

  clip:
    # Number of seconds to keep after the strongest clapper hit.
    post_hit_seconds: 2.0

preprocessor:
  # All pipeline inputs are standardized to AAC in memory at this rate.
  sample_rate: 16000
  # Shared pipeline contract is mono.
  channels: 1
  # AAC keeps the intermediate contract compact and pipe-friendly.
  codec: aac
  # Roadmap default for the encoded AAC bitrate.
  bitrate: 320k

whisper:
  # Local Whisper checkpoint used for speech-to-text.
  model_id: openai/whisper-small
  # Keep Whisper downloads inside the project tree by default.
  cache_dir: .cache/whisper
  # "auto" uses CUDA if available, otherwise CPU.
  device: auto
  # Default transcription language from the notebook experiments.
  language: french 
  # Whisper task used by default in the notebook.
  task: transcribe
  # Keep timestamps available for downstream parsing.
  return_timestamps: true

scene_parser:
  # OpenRouter model to use for scene/take extraction.
  model: google/gemini-3.1-flash-lite
  # OpenAI-compatible API endpoint.
  api_base: https://openrouter.ai/api/v1
  # Name of the environment variable holding the API key.
  api_key_env: OPENROUTER_API_KEY
  # Path to the prompt template file.
  prompt_path: prompts/scene_parser.md
  # LLM temperature (0 = deterministic).
  temperature: 0.0
  # Max tokens in the LLM response.
  max_tokens: 256
  # Instruction/description for the sequence field to guide the LLM format.
  sequence_description: "Sequence number (séquence) (e.g. '1', '10')"
  # Instruction/description for the shot field to guide the LLM format.
  shot_description: "Shot/plan number (plan) (e.g. '3', '3A')"
  # Instruction/description for the take field to guide the LLM format.
  take_description: "Take/prise number (prise) (e.g. 1, 2, 3)"

